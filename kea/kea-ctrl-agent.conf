{
  "Control-agent": {
    "http-host": "127.0.0.1",
    "http-port": 8000,
    "authentication": {
      "type": "basic",
      "realm": "kea-control-agent",
      "clients": [
        { "user": "kea-api", "password": "REPLACE_WITH_STRONG_PASSWORD" }
      ]
    },
    "control-sockets": {
      "dhcp4": {
        "socket-type": "unix",
        "socket-name": "/run/kea/kea4-ctrl-socket"
      }
    },
    "loggers": [{
      "name": "kea-ctrl-agent",
      "output_options": [{ "output": "/var/log/kea/kea-ctrl-agent.log" }],
      "severity": "INFO"
    }]
  }
}
